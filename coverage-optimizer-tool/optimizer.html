<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coverage Optimizer — Life</title>
<link rel="stylesheet" href="optimizer.css">
<link rel="stylesheet" href="optimizer_coverages.css">
<link rel="stylesheet" href="optimizer_insureds.css">
<link rel="stylesheet" href="optimizer_backdate.css">
<link rel="stylesheet" href="optimizer_rates.css">
<link rel="stylesheet" href="optimizer_history.css">
<link rel="stylesheet" href="optimizer_preload.css">
</head>
<body>

<div class="app">

  <!-- ═══════════════════════════════ TOP BAR ═══════════════════════════ -->
  <header class="topbar">
    <div class="brand" id="brandBlock">
      <button class="brand-select" id="toolSelect" aria-haspopup="listbox" aria-expanded="false"
              title="Switch tool">
        <span class="mark">CO</span>
        <span class="brand-txt">
          <span class="brand-name">Coverage Optimizer</span>
          <span class="brand-sub">Life · internal · v0.1.0</span>
        </span>
        <span class="brand-caret" aria-hidden="true">▾</span>
      </button>
      <!-- Options are generated from the TOOLS table in optimizer.js;
           picking the other tool navigates to its page. -->
      <div class="brand-menu" id="toolMenu" role="listbox" aria-label="Tool" hidden></div>
    </div>

    <!-- Message bar (optimizer.js § message bar): why something is an Error. Takes the
         free space between the brand block and Test Case Name; empty (hidden) when
         there is nothing to say. ▲/▼ appear with 2+ messages; ✕ clears the one shown
         (Shift+✕ clears all); clicking the text opens it in full. -->
    <div class="issues" id="issues" role="status" aria-live="polite">
      <div class="issues-box" id="issuesBox" hidden>
        <span class="issues-ico" aria-hidden="true">⚠</span>
        <span class="issues-txt" id="issuesTxt" role="button" tabindex="0" title="Click to read the whole message"></span>
        <span class="issues-nav" id="issuesNav" hidden>
          <span class="issues-n" id="issuesN"></span>
          <button class="btn btn--sm btn--icon" id="issuesUp" type="button" title="Previous message" aria-label="Previous message">▲</button>
          <button class="btn btn--sm btn--icon" id="issuesDown" type="button" title="Next message" aria-label="Next message">▼</button>
        </span>
        <button class="btn btn--sm btn--icon" id="issuesX" type="button" title="Clear this message (Shift+click clears all)" aria-label="Clear this message">✕</button>
        <div class="issues-pop" id="issuesPop" hidden></div>
      </div>
    </div>

    <!-- Save Test / History (optimizer_history.js owns all the wiring here,
         even though the controls themselves are static markup, not
         generated — see that file's header comment). -->
    <input class="fi fi--txt" id="tcName" placeholder="Test Case Name" maxlength="60"
           spellcheck="false" autocomplete="off" title="Test Case Name">
    <!-- Filled in by the pre-load page (optimizer_preload.js): name as text,
         initials in data-ini (the prefix on every saved file name). -->
    <span class="chip" id="tcUser" title="Signed in as"></span>
    <button class="btn btn--primary" id="btnSaveTest" title="Save this test case to History">Save Test</button>

    <button class="btn btn--icon" id="btnTheme" title="Toggle light / dark theme">◐</button>
  </header>

  <!-- ═════════════════════════════════ TABS ════════════════════════════ -->
  <nav class="tabs" role="tablist">
    <!-- Buttons are generated from the TABS table in optimizer.js. -->
    <span class="tab-list" id="tabList"></span>
    <div class="spacer"></div>
    <div class="asof" id="hdrStamp"></div>
  </nav>

  <!-- ═══════════════════════════════ VIEWPORT ══════════════════════════ -->
  <main class="viewport">
    <!-- One <section class="pane"> per tab, generated from TABS. The
         "Input & Results" pane is split 2/3 Inputs + 1/3 Results. -->
    <div id="panes"></div>
  </main>

  <!-- ═══════════════════════════════ STATUS ════════════════════════════ -->
  <footer class="statusbar">
    <span><span class="dot dot--ok" id="stDot"></span><span id="stText">Ready</span></span>
    <span id="stTab"></span>
    <div class="spacer"></div>
    <span class="mono">ENGINE STUBBED</span>
  </footer>

</div>

<!-- ══════════════════════════ PRE-LOAD PAGE ═══════════════════════════════
     Covers the tool until a user is picked AND both rate files say Loaded
     (optimizer_preload.js). The status rows/bar are driven by
     optimizer_rates.js (setRateState / showProgress). -->
<div class="preload" id="preload" role="dialog" aria-modal="true" aria-labelledby="plTitle">
  <div class="pl-card">
    <div class="pl-brand"><span class="mark">CO</span><span class="pl-brand-name">Coverage Optimizer</span></div>
    <h2 id="plTitle">Before you start</h2>

    <div class="pl-sec">
      <div class="micro">1 · Who is using the tool?</div>
      <div class="pl-users" role="radiogroup" aria-label="User">
        <button class="switch pl-user" type="button" role="radio" aria-checked="false" data-user="Catheryne L." data-ini="cl">Catheryne L.</button>
        <button class="switch pl-user" type="button" role="radio" aria-checked="false" data-user="Rafi K." data-ini="rk">Rafi K.</button>
        <button class="switch pl-user" type="button" role="radio" aria-checked="false" data-user="Catherine C." data-ini="cc">Catherine C.</button>
      </div>
    </div>

    <div class="pl-sec">
      <div class="micro">2 · Rates</div>
      <div class="pl-rate" id="plRate_termLife" data-state="notloaded">
        <span class="dot"></span><span class="pl-name">Term Life</span><span class="pl-state">Not loaded</span>
      </div>
      <div class="pl-rate" id="plRate_permLife" data-state="notloaded">
        <span class="dot"></span><span class="pl-name">Permanent Life</span><span class="pl-state">Not loaded</span>
      </div>
      <div class="rate-progress-label" id="plLabel"></div>
      <progress class="rate-progress-bar" id="plBar" max="100" value="0"></progress>
      <button class="btn btn--sm pl-retry" id="plRetry" type="button" hidden>Retry</button>
    </div>

    <div class="pl-foot">
      <button class="btn btn--primary" id="plStart" type="button" disabled>Start</button>
      <span class="pl-hint" id="plHint"></span>
      <!-- DEV BYPASS — delete this button and its handler in optimizer_preload.js when done coding. -->
      <button class="btn btn--sm pl-skip" id="plSkip" type="button"
              title="Development only — enter the tool without waiting for a name or the rates">Skip (dev)</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="xlsx.full.min.js"></script>
<script src="optimizer.js"></script>
<!-- rates first: the Coverages tab (Modal Prem.) and the Backdate tab (rate sums) call
     core.bandTotals / core.allCovRate, published by optimizer_rates.js -->
<script src="optimizer_rates.js"></script>
<script src="optimizer_coverages.js"></script>
<script src="optimizer_insureds.js"></script>
<script src="optimizer_backdate.js"></script>
<script src="optimizer_history.js"></script>
<script src="optimizer_preload.js"></script>
</body>
</html>
